# Diagnóstico temporário da Vitrine em R (ramo diag-vitrine). Não publica nada.
name: Diagnostico Vitrine R

on:
  push:
    branches: [diag-vitrine]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Site publicado depois da correcao
        run: |
          sleep 60
          U=https://biuspoly.github.io/Shiny-Python-Portifolio/r/vitrine/
          timeout 400 python diag/testar_vitrine.py $U publicado || true
          LARGURA=400 timeout 400 python diag/testar_vitrine.py $U publicado || true

# Diagnóstico temporário da Vitrine em R (ramo diag-vitrine). Não publica nada.
name: Diagnostico Vitrine R

on:
  push:
    branches: [diag-vitrine]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Site publicado, computador e celular
        run: |
          U=https://biuspoly.github.io/Shiny-Python-Portifolio/r/vitrine/
          timeout 400 python diag/testar_vitrine.py $U publicado || true
          LARGURA=400 timeout 400 python diag/testar_vitrine.py $U publicado || true
      - name: Guardar as capturas num ramo
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git checkout --orphan diag-vitrine-prints
          git rm -rq --cached . ; git add prints_diag; git commit -qm "capturas do diagnostico"
          git push -f origin diag-vitrine-prints

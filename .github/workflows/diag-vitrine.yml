# Diagnóstico temporário da Vitrine em R (ramo diag-vitrine). Não publica nada.
name: Diagnostico Vitrine R

on:
  push:
    branches: [diag-vitrine]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::shinylive, any::shiny, any::bs4Dash, any::fresh, any::htmltools
      - name: Versao corrigida no Shinylive, computador e celular
        run: |
          (cd R/Vitrine && Rscript core/gerar_tema.R)
          Rscript -e 'shinylive::export("R/Vitrine", "site_diag/r/vitrine")'
          (python -m http.server 8000 -d site_diag > /dev/null 2>&1 &)
          sleep 3
          U=http://127.0.0.1:8000/r/vitrine/
          timeout 400 python diag/testar_vitrine.py $U corrigido || true
          LARGURA=400 timeout 400 python diag/testar_vitrine.py $U corrigido || true
      - name: Guardar as capturas num ramo
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git checkout --orphan diag-vitrine-prints
          git rm -rq --cached . ; git add prints_diag; git commit -qm "capturas do diagnostico"
          git push -f origin diag-vitrine-prints

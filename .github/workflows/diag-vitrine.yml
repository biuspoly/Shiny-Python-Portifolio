# Diagnóstico temporário da Vitrine em R (ramo diag-vitrine). Não publica nada.
name: Diagnostico Vitrine R

on:
  push:
    branches: [diag-vitrine]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::shinylive, any::shiny, any::bs4Dash, any::fresh, any::htmltools
      - name: Versoes
        run: Rscript -e 'for (p in c("shiny","bs4Dash","fresh","shinylive","htmltools")) cat(p, as.character(packageVersion(p)), "\n")'
      - name: Tempo do create_theme no R normal
        run: Rscript -e 'library(fresh); library(bs4Dash); setwd("R/Vitrine"); print(system.time(source("core/tema.R")))'
      - name: App normal (R no servidor)
        run: |
          (cd R/Vitrine && Rscript -e 'shiny::runApp(".", port = 3838)' > /tmp/app.log 2>&1 &)
          sleep 25
          python diag/testar_vitrine.py http://127.0.0.1:3838/ normal || true
          echo "----- log do R -----"; cat /tmp/app.log
      - name: Shinylive
        run: |
          Rscript -e 'shinylive::export("R/Vitrine", "site_diag")'
          du -sh site_diag; du -sh site_diag/shinylive/webr/packages/* | sort -h | tail -15
          (python -m http.server 8000 -d site_diag > /dev/null 2>&1 &)
          sleep 3
          timeout 600 python diag/testar_vitrine.py http://127.0.0.1:8000/ shinylive || true

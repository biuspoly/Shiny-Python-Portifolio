# Refaz os dados e publica o site no GitHub Pages e o ramo "posit" (de onde o Posit Connect Cloud
# publica os apps). Toda segunda de manhã: as datas andam para a semana corrente e os indicadores
# do Banco Central chegam atualizados. Também roda a cada push na main.
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # segunda, 6h de Brasília
  workflow_dispatch:

permissions:
  contents: write # o ramo "posit"
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Conferir o código
        run: ruff check . && ruff format --check .
      - name: Gerar os dados
        run: python -m gerador.gerar_tudo
      # Os originais em R: o shinylive (R) só empacota para o navegador os pacotes instalados aqui.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive, any::shiny, any::bslib, any::bs4Dash, any::fresh, any::dplyr, any::tidyr,
            any::purrr, any::lubridate, any::stringr, any::stringdist, any::zoo, any::glue, any::htmltools,
            any::htmlwidgets, any::jsonlite, any::knitr, any::scales, any::DBI, any::duckdb, any::nanoparquet,
            any::DT, any::reactable, any::reactable.extras, any::shinyWidgets, any::shinyFeedback,
            any::shinycssloaders, any::shinyalert, any::shinyjs, any::cicerone, any::writexl, any::plotly,
            any::ggplot2, any::echarts4r, any::leaflet, any::sf, any::bsicons, any::future, any::promises,
            any::rsconnect, any::cpp11
      # O Posit Connect Cloud publica cada app de uma pasta deste ramo, com os dados da semana (que a main
      # não guarda) e o manifest.json de cada app em R. Um commit só, regravado a cada execução: o histórico
      # não acumula os .parquet de toda semana. Push feito pelo GITHUB_TOKEN não dispara outro workflow.
      - name: Ramo posit
        run: python -m publicar.ramo_posit
      - name: Tema da Vitrine em R
        working-directory: R/Vitrine
        run: Rscript core/gerar_tema.R
      - name: Montar o site
        run: python -m publicar.montar_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

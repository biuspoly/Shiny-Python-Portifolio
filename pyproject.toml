[project]
name = "shiny-portfolio"
version = "1.0.0"
description = "Portfólio Marlon Amaral: seis painéis Shiny for Python com dados fictícios"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
extend-exclude = ["tmp", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# O código das telas vem do sistema original, com as linhas e os nomes de lá.
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["core", "pages", "gerador"]

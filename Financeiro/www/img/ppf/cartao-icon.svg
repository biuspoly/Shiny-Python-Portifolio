<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Cartão de crédito">
  <title>Pagamento no cartão de crédito</title>
  <!-- O cartao: o corpo azul, a tarja escura, o chip dourado e a linha do numero. -->
  <rect x="2" y="6" width="28" height="20" rx="3" fill="#2563EB"/>
  <rect x="2" y="10" width="28" height="4" fill="#1E3A8A"/>
  <rect x="6" y="17" width="7" height="5" rx="1" fill="#FBBF24"/>
  <rect x="16" y="19.5" width="10" height="2" rx="1" fill="#BFDBFE"/>
</svg>
